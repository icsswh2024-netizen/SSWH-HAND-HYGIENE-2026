<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันล้างมือโลก - Global Handwashing Day Video Contest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-from: #2563eb;
            --brand-mid: #0ea5e9;
            --brand-to: #06b6d4;
        }

        body {
            background: linear-gradient(180deg, #eff6ff 0%, #e0f2fe 45%, #cffafe 100%);
            background-attachment: fixed;
            font-family: 'Sarabun', sans-serif;
            color: #1e293b;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Premium display font for headings */
        .font-display {
            font-family: 'Kanit', sans-serif;
            letter-spacing: 0.01em;
        }

        .brand-gradient {
            background-image: linear-gradient(120deg, var(--brand-from) 0%, var(--brand-mid) 55%, var(--brand-to) 100%);
        }

        .text-gradient {
            background-image: linear-gradient(120deg, #1d4ed8 0%, #0891b2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Water Bubbles Animation */
        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            animation: rise linear infinite;
            z-index: -1;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-1000px) scale(1.5); opacity: 0; }
        }

        /* Premium header halo */
        .header-halo::before,
        .header-halo::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }
        .header-halo::before { width: 240px; height: 240px; top: -90px; right: -40px; }
        .header-halo::after  { width: 160px; height: 160px; bottom: -70px; left: 8%; }

        /* Landscape Mobile Mockup */
        .mobile-landscape-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 landscape */
            background-color: #0f172a;
            border-radius: 22px;
            border: 7px solid #111827;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.28), inset 0 0 0 2px rgba(255,255,255,0.05);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-landscape-frame::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 44px;
            background-color: #1f2937;
            border-radius: 8px;
            z-index: 10;
        }

        .mobile-landscape-frame video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Premium input styling */
        .premium-input {
            transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
        }
        .premium-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
            background-color: #fff;
        }

        /* Card hover lift */
        .work-card {
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .work-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 40px rgba(2, 132, 199, 0.16);
        }

        /* Pill button */
        .btn-send {
            background-image: linear-gradient(120deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .btn-send:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 26px rgba(37, 99, 235, 0.45); }
        .btn-send:active { transform: translateY(0); }

        /* Custom Scrollbar for Comments */
        .comments-container::-webkit-scrollbar { width: 6px; }
        .comments-container::-webkit-scrollbar-thumb { background-color: #bae6fd; border-radius: 4px; }
        .comments-container::-webkit-scrollbar-track { background: transparent; }

        .star-icon { transition: transform .12s ease, color .12s ease; }
        .star-icon:hover { transform: scale(1.15); }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Bubble Background Elements -->
    <div id="bubbles-container"></div>

    <!-- Header Section -->
    <header class="brand-gradient header-halo text-white pt-10 pb-12 px-4 shadow-xl relative overflow-hidden rounded-b-[40px]">
        <div class="container mx-auto max-w-5xl relative">

            <!-- ปุ่มดูผลโหวต -->
            <button id="viewResultsBtn" class="absolute top-0 right-0 bg-white/95 text-blue-700 px-5 py-2 rounded-full shadow-lg hover:bg-white transition font-display font-semibold text-sm flex items-center backdrop-blur">
                <i class="fa-solid fa-chart-column mr-2"></i> ผล Vote
            </button>

            <div class="text-center pt-6">
                <h1 class="font-display text-4xl md:text-6xl font-bold mb-2 flex items-center justify-center gap-3 drop-shadow-sm">
                    <i class="fa-solid fa-hands-bubbles"></i>วันล้างมือโลก
                </h1>
                <p class="font-display text-xl md:text-2xl font-light tracking-wide text-cyan-50/95">Global Handwashing Day Video Contest</p>

                <div class="mt-6 max-w-2xl mx-auto bg-white/15 border border-white/25 rounded-2xl px-6 py-4 backdrop-blur-sm text-sm md:text-base leading-relaxed text-cyan-50">
                    ส่งผลงานวิดีโอสร้างสรรค์รณรงค์การล้างมือให้ถูกวิธี 7 ขั้นตอน<br>
                    <span class="font-semibold text-white">กติกา:</span> แนบลิงก์ผลงาน (MP4) อัปโหลดเพื่อร่วมสนุก ให้คะแนน และคอมเมนต์เป็นกำลังใจ!
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto max-w-5xl px-4 mt-10">

        <!-- Submission Form Section -->
        <section class="bg-white rounded-3xl shadow-xl shadow-sky-100 p-6 md:p-8 mb-14 border border-sky-50">
            <h3 class="font-display text-2xl font-semibold text-gradient mb-5 flex items-center gap-3">
                <i class="fa-solid fa-cloud-arrow-up text-sky-500"></i>ส่งผลงานเข้าประกวด
            </h3>
            <div class="border-t border-slate-100 mb-6"></div>

            <form id="submissionForm">
                <div class="grid grid-cols-1 md:grid-cols-[1fr_1fr_auto] gap-5 items-end">
                    <div>
                        <label class="block text-slate-600 font-semibold text-sm mb-2">ชื่อผลงาน / ผู้เข้าแข่งขัน</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            <input type="text" id="teamName" required placeholder="เช่น ด.ญ. รักสะอาด" class="premium-input w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 font-semibold text-sm mb-2">ลิงก์วิดีโอ (URL MP4)</label>
                        <div class="relative">
                            <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            <input type="url" id="videoUrl" required placeholder="https://example.com/video.mp4" class="premium-input w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none text-sm">
                        </div>
                    </div>
                    <button type="submit" class="btn-send text-white font-display font-semibold py-3 px-6 rounded-xl flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-paper-plane"></i> ส่งวิดีโอ
                    </button>
                </div>
                <p class="text-xs text-slate-400 mt-3"><i class="fa-regular fa-circle-info mr-1"></i>กรุณาแนบลิงก์ตรงของไฟล์วิดีโอ (.mp4)</p>
            </form>
        </section>

        <!-- Gallery Section -->
        <section>
            <div class="flex items-center justify-between mb-7">
                <h3 class="font-display text-2xl md:text-3xl font-semibold text-gradient flex items-center gap-3">
                    <i class="fa-solid fa-photo-film text-sky-500"></i>แกลเลอรีผลงาน
                </h3>
                <span id="clipCount" class="bg-cyan-100 text-cyan-700 font-display font-semibold text-sm px-4 py-1.5 rounded-full shadow-sm">0 คลิป</span>
            </div>

            <!-- 3 Columns Grid -->
            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
                <!-- Cards will be dynamically inserted here -->
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // ส่วนตั้งค่าเชื่อมต่อ GOOGLE APPS SCRIPT
        // ==========================================
        // นำ URL Web App ที่ได้จาก Google Apps Script มาใส่ที่นี่
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_WEB_APP_ID/exec';

        // ฟังก์ชันเบื้องหลังสำหรับส่งข้อมูลไปต่อท้ายแถว (Append Row) ใน Google Sheet
        function sendDataToSheet(action, payload) {
            // ทำการเข้ารหัสข้อมูลเพื่อส่งแบบ Form URL Encoded
            const formData = new URLSearchParams();
            formData.append('action', action);
            formData.append('payload', JSON.stringify(payload));

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // ป้องกันปัญหา CORS
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).catch(error => console.error('Error syncing to Google Sheet:', error));
        }
        // ==========================================


        // Create Bubbles Background
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            for (let i = 0; i < 20; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 40 + 10 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
            }
        }
        createBubbles();

        // SweetAlert for View Results Button
        document.getElementById('viewResultsBtn').addEventListener('click', () => {
            Swal.fire({
                icon: 'info',
                title: 'ยังไม่สามารถดูได้',
                text: 'ผลคะแนนโหวตจะสามารถดูได้เมื่อแอดมินทำการปิดระบบโหวตแล้วเท่านั้นครับ',
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'รับทราบ'
            });
        });

        // Mock Data
        let videoData = [
            {
                id: 1,
                title: "ล้างมือให้สะอาด ปราศจากโรคภัย",
                author: "น้องฟ้าใส",
                url: "https://www.w3schools.com/html/mov_bbb.mp4",
                views: 890,
                totalScore: 45,
                hasVoted: false,
                comments: []
            },
            {
                id: 2,
                title: "ล้างมือ 7 ขั้นตอน ป้องกันเชื้อโรค",
                author: "โรงเรียนอนุบาลใจดี",
                url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
                views: 2450,
                totalScore: 30,
                hasVoted: false,
                comments: []
            },
            {
                id: 3,
                title: "รณรงค์ล้างมือก่อนทานข้าว",
                author: "ด.ช. ต้นน้ำ",
                url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
                views: 1205,
                totalScore: 20,
                hasVoted: false,
                comments: []
            }
        ];

        const gallery = document.getElementById('gallery');
        const form = document.getElementById('submissionForm');
        const clipCount = document.getElementById('clipCount');

        // Format number with thousands separator
        function formatViews(n) {
            return Number(n).toLocaleString('en-US');
        }

        // Form Submit Handler
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('teamName').value;
            const url = document.getElementById('videoUrl').value;

            const newId = Date.now();
            const newVideo = {
                id: newId,
                title: title,
                author: title,
                url: url,
                views: 0,
                totalScore: 0,
                hasVoted: false,
                comments: []
            };

            videoData.push(newVideo);
            renderGallery();
            form.reset();

            // ส่งข้อมูลไปบันทึกบน Google Sheet (เรียงแถว)
            sendDataToSheet('ADD_VIDEO', newVideo);

            Swal.fire({
                icon: 'success',
                title: 'ส่งผลงานสำเร็จ!',
                text: 'วิดีโอของคุณถูกเพิ่มลงในแกลเลอรีแล้ว',
                timer: 2000,
                showConfirmButton: false
            });
        });

        // Render Cards
        function renderGallery() {
            gallery.innerHTML = '';
            videoData.forEach(video => {
                const card = createCardDOM(video);
                gallery.appendChild(card);
                attachCardEvents(card, video);
            });
            clipCount.textContent = `${videoData.length} คลิป`;
        }

        // Comment markup helper
        function commentHtml(c) {
            return `
                <div class="bg-sky-50 border border-sky-100 px-3 py-2 rounded-xl text-sm">
                    <span class="font-semibold text-blue-600">${c.user}:</span> <span class="text-slate-600">${c.text}</span>
                </div>`;
        }

        const emptyCommentsHtml = `<p class="text-center text-slate-400 text-sm italic py-2">ยังไม่มีความคิดเห็น</p>`;

        // Generate Card DOM Structure
        function createCardDOM(video) {
            const card = document.createElement('div');
            card.classList.add('work-card', 'bg-white', 'rounded-3xl', 'shadow-lg', 'shadow-sky-100', 'overflow-hidden', 'flex', 'flex-col', 'border', 'border-sky-50');

            // Generate Stars HTML
            let starsHtml = '';
            for(let i=1; i<=5; i++) {
                starsHtml += `<i class="fa-solid fa-star text-slate-200 cursor-pointer text-xl star-icon" data-value="${i}"></i>`;
            }

            // Determine if voted text should show
            const voteStatusHtml = video.hasVoted
                ? `<span class="text-green-500 font-semibold ml-2 text-sm">โหวตแล้ว <i class="fa-solid fa-check"></i></span>`
                : `<span class="text-sm text-slate-400 ml-2 vote-prompt">ให้คะแนน</span>`;

            const commentsInner = video.comments.length
                ? video.comments.map(commentHtml).join('')
                : emptyCommentsHtml;

            card.innerHTML = `
                <div class="px-5 pt-5 pb-3">
                    <h4 class="font-display text-lg font-semibold text-slate-800 leading-snug truncate" title="${video.title}">${video.title}</h4>
                    <p class="text-sm text-cyan-600 font-medium mt-1"><i class="fa-solid fa-pen-nib mr-1"></i>โดย ${video.author}</p>
                </div>

                <div class="px-5">
                    <div class="mobile-landscape-frame">
                        <video src="${video.url}" loop muted playsinline data-id="${video.id}"></video>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 hover:opacity-100 transition-opacity bg-black/30">
                            <i class="fa-solid fa-volume-xmark text-white text-4xl" id="mute-icon-${video.id}"></i>
                        </div>
                    </div>
                </div>

                <div class="p-5 flex-1 flex flex-col">
                    <!-- Views + Rating -->
                    <div class="flex justify-between items-center mb-4">
                        <span class="inline-flex items-center gap-2 bg-sky-50 text-sky-700 font-semibold text-sm px-3 py-1.5 rounded-full">
                            <i class="fa-solid fa-eye"></i><span id="views-${video.id}">${formatViews(video.views)}</span>
                        </span>
                        <div class="flex items-center">
                            <div class="stars-container flex items-center space-x-1" data-id="${video.id}">
                                ${starsHtml}
                            </div>
                            <div class="score-display" id="score-display-${video.id}">
                                ${voteStatusHtml}
                            </div>
                        </div>
                    </div>

                    <!-- Comments Section -->
                    <div class="mt-auto border-t border-slate-100 pt-4">
                        <h5 class="text-sm font-semibold text-sky-700 mb-2 flex items-center gap-1"><i class="fa-regular fa-comments"></i>ความคิดเห็น</h5>
                        <div class="comments-container max-h-32 overflow-y-auto mb-3 space-y-2 pr-1" id="comments-${video.id}">
                            ${commentsInner}
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="text" id="comment-input-${video.id}" placeholder="พิมพ์ความคิดเห็น..." class="premium-input flex-1 px-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-full focus:outline-none">
                            <button class="submit-comment bg-cyan-500 hover:bg-cyan-600 text-white w-9 h-9 rounded-full flex items-center justify-center transition shrink-0" data-id="${video.id}"><i class="fa-solid fa-paper-plane text-sm"></i></button>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // Attach functionality to cards (Video play, Views, Rating, Comments)
        function attachCardEvents(card, video) {
            const vidElement = card.querySelector('video');
            const muteIcon = card.querySelector(`#mute-icon-${video.id}`);
            const starsContainer = card.querySelector(`.stars-container`);
            const stars = starsContainer.querySelectorAll('.star-icon');
            const submitCommentBtn = card.querySelector('.submit-comment');

            // Video Click: Toggle Mute and Play
            vidElement.addEventListener('click', () => {
                if (vidElement.muted) {
                    vidElement.muted = false;
                    vidElement.play();
                    muteIcon.classList.remove('fa-volume-xmark');
                    muteIcon.classList.add('fa-volume-high');

                    // Increment view only once per card initialization when first unmuted/played
                    if(!vidElement.dataset.viewed) {
                        video.views += 1;
                        document.getElementById(`views-${video.id}`).innerText = formatViews(video.views);
                        vidElement.dataset.viewed = "true";
                        // ส่งข้อมูลเข้า Sheet
                        sendDataToSheet('ADD_VIEW', { id: video.id });
                    }
                } else {
                    vidElement.muted = true;
                    muteIcon.classList.remove('fa-volume-high');
                    muteIcon.classList.add('fa-volume-xmark');
                }
            });

            // Autoplay on hover (muted)
            vidElement.addEventListener('mouseenter', () => { if(vidElement.muted) vidElement.play(); });
            vidElement.addEventListener('mouseleave', () => { if(vidElement.muted) vidElement.pause(); });

            // Restore star visuals if already voted in this session
            if (video.hasVoted) {
                stars.forEach(s => {
                    s.classList.replace('text-slate-200', 'text-yellow-400');
                    s.classList.remove('cursor-pointer');
                });
            }

            // Star Rating Logic
            stars.forEach((star, index) => {
                star.addEventListener('mouseenter', () => {
                    if(video.hasVoted) return;
                    stars.forEach((s, i) => {
                        if(i <= index) s.classList.replace('text-slate-200', 'text-yellow-400');
                        else s.classList.replace('text-yellow-400', 'text-slate-200');
                    });
                });

                star.addEventListener('mouseleave', () => {
                    if(video.hasVoted) return;
                    stars.forEach(s => s.classList.replace('text-yellow-400', 'text-slate-200'));
                });

                star.addEventListener('click', () => {
                    if(video.hasVoted) {
                        Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: 'คุณได้โหวตผลงานนี้ไปแล้ว!', showConfirmButton: false, timer: 2000 });
                        return;
                    }

                    const score = index + 1;
                    video.totalScore += score;
                    video.hasVoted = true;

                    // Lock visually
                    stars.forEach((s, i) => {
                        if(i <= index) s.classList.replace('text-slate-200', 'text-yellow-400');
                        else s.classList.replace('text-yellow-400', 'text-slate-200');
                        s.classList.remove('cursor-pointer');
                    });

                    // Hide raw score, Show "โหวตแล้ว"
                    const display = document.getElementById(`score-display-${video.id}`);
                    display.innerHTML = `<span class="text-green-500 font-semibold ml-2 text-sm animate-pulse">โหวตแล้ว <i class="fa-solid fa-check"></i></span>`;

                    // ส่งข้อมูลคะแนนไปเรียงเก็บเป็น Log ที่ Sheet หลังบ้าน
                    sendDataToSheet('ADD_VOTE', { id: video.id, score: score });

                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'บันทึกคะแนนโหวตสำเร็จ!', showConfirmButton: false, timer: 1500 });
                });
            });

            // Comment Submit Logic
            submitCommentBtn.addEventListener('click', () => {
                const input = document.getElementById(`comment-input-${video.id}`);
                const text = input.value.trim();
                if(text) {
                    const newComment = { user: "ผู้เยี่ยมชม", text: text };
                    const isFirst = video.comments.length === 0;
                    video.comments.push(newComment);

                    const container = document.getElementById(`comments-${video.id}`);
                    if(isFirst) container.innerHTML = '';
                    container.insertAdjacentHTML('beforeend', commentHtml(newComment));

                    // Scroll to bottom
                    container.scrollTop = container.scrollHeight;
                    input.value = '';

                    // ส่งข้อมูลคอมเมนต์ไป Sheet
                    sendDataToSheet('ADD_COMMENT', { id: video.id, text: text, user: "ผู้เยี่ยมชม" });
                }
            });

            // Allow Enter key to submit comment
            card.querySelector(`#comment-input-${video.id}`).addEventListener('keydown', (e) => {
                if(e.key === 'Enter') { e.preventDefault(); submitCommentBtn.click(); }
            });
        }

        // Initialize App
        renderGallery();

    </script>
</body>
</html>
